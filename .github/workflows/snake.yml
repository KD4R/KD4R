name: Generate Snake Animation

on:
  # Run daily at midnight UTC (adjust as needed)
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate Snake Animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            # Premium custom theme example (uncomment & tweak colors)
            # dist/github-contribution-grid-snake-premium.svg?color_snake=#00ff9f&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            # Ocean-inspired premium (vibrant)
            # dist/github-contribution-grid-snake-ocean.svg?color_snake=#00b4d8&color_dots=#caf0f8,#90e0ef,#00b4d8,#0077b6,#03045e

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
